<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polymarket Top Traders by Volume</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .animate-spin {
            animation: spin 1s linear infinite;
        }
    </style>
</head>
<body class="bg-black min-h-screen">
    <div class="max-w-7xl mx-auto p-4 md:p-8">
        <!-- Header -->
        <div class="text-center mb-12">
            <div class="flex items-center justify-center mb-4">
                <svg class="w-12 h-12 text-white mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path>
                </svg>
                <h1 class="text-4xl md:text-5xl font-bold text-white">
                    Top Traders by Volume
                </h1>
            </div>
            <p class="text-gray-400 text-lg">
                All-time highest volume traders with bets ≥ $1,000
            </p>
            <div class="flex items-center justify-center mt-4 space-x-4">
                <div id="lastUpdate" class="flex items-center text-gray-400 text-sm">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <span id="updateTime">Loading...</span>
                </div>
                <button
                    onclick="fetchTopTraders()"
                    id="refreshBtn"
                    class="flex items-center space-x-2 bg-white hover:bg-gray-200 text-black px-4 py-2 rounded-lg transition-colors text-sm font-medium"
                >
                    <svg id="refreshIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                    <span>Refresh</span>
                </button>
            </div>
        </div>

        <!-- Loading -->
        <div id="loading" class="flex items-center justify-center py-20">
            <div class="text-center">
                <div class="animate-spin rounded-full h-16 w-16 border-t-2 border-b-2 border-white mx-auto mb-4"></div>
                <p class="text-gray-400 text-lg">Loading top traders...</p>
            </div>
        </div>

        <!-- Error -->
        <div id="error" class="hidden bg-red-900/30 border border-red-600 text-red-200 px-4 py-3 rounded-lg mb-6">
            <p id="errorMessage"></p>
        </div>

        <!-- Traders List -->
        <div id="tradersList" class="space-y-6 hidden"></div>

        <!-- Footer -->
        <div class="text-center mt-12 text-gray-500 text-sm">
            Data sourced from Polymarket API
        </div>
    </div>

    <script>
        let isLoading = false;

        function formatAddress(address) {
            if (!address || address.length < 10) return address;
            return `${address.slice(0, 6)}...${address.slice(-4)}`;
        }

        function formatMoney(value) {
            return new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: 'USD',
                minimumFractionDigits: 0,
                maximumFractionDigits: 0,
            }).format(value);
        }

        function formatTime(timestamp) {
            const date = new Date(timestamp);
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMs / 3600000);
            const diffDays = Math.floor(diffMs / 86400000);

            if (diffMins < 60) return `${diffMins}m ago`;
            if (diffHours < 24) return `${diffHours}h ago`;
            if (diffDays < 7) return `${diffDays}d ago`;
            return date.toLocaleDateString();
        }

        async function fetchTopTraders() {
            if (isLoading) return;
            
            isLoading = true;
            const refreshIcon = document.getElementById('refreshIcon');
            const refreshBtn = document.getElementById('refreshBtn');
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const tradersList = document.getElementById('tradersList');
            
            refreshIcon.classList.add('animate-spin');
            refreshBtn.disabled = true;
            loading.classList.remove('hidden');
            tradersList.classList.add('hidden');
            error.classList.add('hidden');

            try {
                const response = await fetch('/api/leaderboard');
                
                if (!response.ok) {
                    throw new Error('Failed to fetch data');
                }

                const data = await response.json();
                displayTraders(data);
                
                const now = new Date();
                document.getElementById('updateTime').textContent = `Last updated: ${now.toLocaleTimeString()}`;
            } catch (err) {
                console.error('Error:', err);
                document.getElementById('errorMessage').textContent = 
                    'Failed to load trader data. Please try again.';
                error.classList.remove('hidden');
            } finally {
                isLoading = false;
                loading.classList.add('hidden');
                refreshIcon.classList.remove('animate-spin');
                refreshBtn.disabled = false;
            }
        }

        function displayTraders(traders) {
            const tradersList = document.getElementById('tradersList');
            tradersList.innerHTML = '';

            traders.forEach((trader, index) => {
                const fullAddress = trader.fullAddress || trader.user || trader.account || trader.address;
                const displayAccount = fullAddress ? formatAddress(fullAddress) : `Trader ${index + 1}`;
                const profit = trader.profit || trader.pnl || 0;
                const volume = trader.volume || trader.total_volume || 0;
                const markets = trader.markets_traded || 0;
                const winRate = trader.win_rate || 0;
                const recentBets = trader.recentBets || [];

                let betsHTML = '';
                if (recentBets.length > 0) {
                    betsHTML = `
                        <div class="mt-4 pt-4 border-t border-zinc-800">
                            <h3 class="text-gray-400 text-sm font-semibold mb-3">Recent Bets ≥ $1,000</h3>
                            <div class="space-y-2">
                                ${recentBets.map(bet => `
                                    <div class="bg-zinc-800/50 rounded-lg p-3 hover:bg-zinc-800 transition-colors">
                                        <div class="flex items-start justify-between gap-3">
                                            <div class="flex-1 min-w-0">
                                                <p class="text-white text-sm font-medium truncate">${bet.market}</p>
                                                <div class="flex items-center gap-3 mt-1 text-xs">
                                                    <span class="text-gray-400">${formatTime(bet.timestamp)}</span>
                                                    ${bet.outcome ? `<span class="px-2 py-0.5 bg-zinc-700 text-gray-300 rounded">${bet.outcome}</span>` : ''}
                                                </div>
                                            </div>
                                            <div class="text-white font-semibold text-sm whitespace-nowrap">
                                                ${formatMoney(bet.amount)}
                                            </div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                } else {
                    betsHTML = `
                        <div class="mt-4 pt-4 border-t border-zinc-800">
                            <p class="text-gray-500 text-sm italic">No recent bets ≥ $1,000</p>
                        </div>
                    `;
                }

                const traderCard = `
                    <div class="bg-zinc-900 border border-zinc-800 rounded-lg p-6 hover:border-zinc-700 transition-all">
                        <div class="flex items-center justify-between flex-wrap gap-4 mb-4">
                            <div class="flex items-center space-x-4">
                                <div class="bg-white text-black rounded-full w-12 h-12 flex items-center justify-center font-bold text-xl">
                                    #${index + 1}
                                </div>
                                <div>
                                    <div class="flex items-center space-x-2">
                                        <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                                        </svg>
                                        <span class="text-white font-mono text-lg">
                                            ${displayAccount}
                                        </span>
                                    </div>
                                    <div class="flex items-center space-x-4 mt-2 flex-wrap gap-2">
                                        <div class="flex items-center text-white">
                                            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z"></path>
                                            </svg>
                                            <span class="font-semibold">${formatMoney(volume)}</span>
                                            <span class="text-gray-400 text-sm ml-1">volume</span>
                                        </div>
                                        <div class="flex items-center text-gray-400 text-sm">
                                            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                            </svg>
                                            ${formatMoney(profit)} profit
                                        </div>
                                        ${markets > 0 ? `<div class="text-gray-400 text-sm">${markets} markets</div>` : ''}
                                        ${winRate > 0 ? `<div class="text-gray-400 text-sm">${winRate}% win rate</div>` : ''}
                                    </div>
                                </div>
                            </div>
                            <a
                                href="https://polymarket.com/profile/${fullAddress}"
                                target="_blank"
                                rel="noopener noreferrer"
                                class="flex items-center space-x-2 bg-white hover:bg-gray-200 text-black px-4 py-2 rounded-lg transition-colors text-sm font-medium"
                            >
                                <span>View Profile</span>
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                                </svg>
                            </a>
                        </div>
                        ${betsHTML}
                    </div>
                `;
                
                tradersList.innerHTML += traderCard;
            });

            tradersList.classList.remove('hidden');
        }

        // Load data when page loads
        fetchTopTraders();
    </script>
</body>
</html>
